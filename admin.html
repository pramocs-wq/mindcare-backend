<script>
  // Add a timestamp query param to force-bypass API / CDN cache
  const API_URL = "https://mindcare-backend-5bz1.onrender.com/api/appointments?v=" + new Date().getTime();

  function parseDate(str) {
    if (!str) return 0;
    // Parses "DD/MM/YYYY, HH:MM am/pm"
    const match = str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})\s*(am|pm)$/i);
    if (match) {
      let [, d, m, y, h, min, pm] = match;
      h = parseInt(h, 10);
      if (pm.toLowerCase() === 'pm' && h < 12) h += 12;
      if (pm.toLowerCase() === 'am' && h === 12) h = 0;
      return new Date(y, m - 1, d, h, min).getTime();
    }
    return new Date(str).getTime() || 0;
  }

  async function fetchAppointments() {
    const tableBody = document.getElementById("appointmentsTable");
    const totalCount = document.getElementById("totalCount");

    try {
      const res = await fetch(API_URL);
      const data = await res.json();

      // SORT INLINE BEFORE RENDER (Newest First)
      data.sort((a, b) => parseDate(b.appointment_time) - parseDate(a.appointment_time));

      totalCount.innerText = `Total Appointments: ${data.length}`;

      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7">No appointments found.</td></tr>`;
        return;
      }

      tableBody.innerHTML = data.map(app => `
        <tr>
          <td>${app.id}</td>
          <td><strong>${app.appointment_time || 'N/A'}</strong></td>
          <td>${app.client_name || 'N/A'}</td>
          <td>${app.phone || 'N/A'}</td>
          <td>${app.counselor_name || 'N/A'}</td>
          <td>${app.notes || ''}</td>
          <td>
            <button class="delete-btn" onclick="deleteAppointment(${app.id})">Delete</button>
          </td>
        </tr>
      `).join('');

    } catch (err) {
      console.error(err);
      tableBody.innerHTML = `<tr><td colspan="7" style="color: red;">Failed to load data.</td></tr>`;
    }
  }

  fetchAppointments();
</script>
