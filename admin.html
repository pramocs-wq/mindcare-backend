<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Mindcare</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-container h2 { margin: 0; color: #333; }
    .logo { max-height: 50px; width: auto; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; background: #007bff; }
    .btn:hover { background: #0056b3; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    .delete-btn { padding: 6px 12px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .delete-btn:hover { background: #c9302c; }
    .count-badge { font-weight: bold; margin-bottom: 10px; display: block; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-container">
      <div style="display: flex; align-items: center; gap: 15px;">
        <img src="logo.png" alt="Mindcare Logo" class="logo">
        <h2>Booked Appointments Dashboard</h2>
      </div>
      <button class="btn" onclick="fetchAppointments()">Refresh Data</button>
    </div>

    <span class="count-badge" id="totalCount">Total Appointments: 0</span>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Date & Time</th>
          <th>Client Name</th>
          <th>Phone</th>
          <th>Counselor</th>
          <th>Notes</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="appointmentsTable">
        <tr><td colspan="7">Loading appointments...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://mindcare-backend-5bz1.onrender.com";
    let appointmentsData = [];

    // Converts "DD/MM/YYYY, HH:MM am/pm" into a numeric timestamp
    function parseDateToTimestamp(dateStr) {
      if (!dateStr) return 0;

      if (dateStr.includes('-')) {
        return new Date(dateStr).getTime() || 0;
      }

      const parts = dateStr.split(',');
      if (parts.length >= 2) {
        const dateParts = parts[0].trim().split('/');
        if (dateParts.length === 3) {
          const day = dateParts[0];
          const month = dateParts[1];
          const year = dateParts[2];

          let timeStr = parts[1].trim();
          let [time, modifier] = timeStr.split(' ');
          let [hours, minutes] = time.split(':');

          hours = parseInt(hours, 10);
          if (modifier && modifier.toLowerCase() === 'pm' && hours < 12) hours += 12;
          if (modifier && modifier.toLowerCase() === 'am' && hours === 12) hours = 0;

          const formattedIso = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}T${String(hours).padStart(2, '0')}:${minutes.padStart(2, '0')}:00`;
          return new Date(formattedIso).getTime() || 0;
        }
      }

      return new Date(dateStr).getTime() || 0;
    }

    function renderTable() {
      const tableBody = document.getElementById("appointmentsTable");
      const totalCount = document.getElementById("totalCount");

      totalCount.innerText = `Total Appointments: ${appointmentsData.length}`;

      if (appointmentsData.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7">No appointments found.</td></tr>`;
        return;
      }

      // NEWEST DATES FIRST (Descending order)
      const sorted = [...appointmentsData].sort((a, b) => {
        return parseDateToTimestamp(b.appointment_time) - parseDateToTimestamp(a.appointment_time);
      });

      tableBody.innerHTML = sorted.map(app => `
        <tr>
          <td>${app.id}</td>
          <td><strong>${app.appointment_time || 'N/A'}</strong></td>
          <td>${app.client_name || 'N/A'}</td>
          <td>${app.phone || 'N/A'}</td>
          <td>${app.counselor_name || 'N/A'}</td>
          <td>${app.notes || ''}</td>
          <td>
            <button class="delete-btn" onclick="deleteAppointment(${app.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    async function fetchAppointments() {
      const tableBody = document.getElementById("appointmentsTable");

      try {
        const res = await fetch(`${API_URL}/api/appointments`);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        
        appointmentsData = await res.json();
        renderTable();

      } catch (err) {
        console.error("Error fetching data:", err);
        tableBody.innerHTML = `<tr><td colspan="7" style="color: red;">Failed to load appointments: ${err.message}</td></tr>`;
      }
    }

    async function deleteAppointment(id) {
      if (!confirm(`Are you sure you want to delete appointment #${id}?`)) return;

      try {
        const res = await fetch(`${API_URL}/api/appointments/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error("Delete failed");
        fetchAppointments();
      } catch (err) {
        alert(`Error deleting appointment: ${err.message}`);
      }
    }

    fetchAppointments();
  </script>
</body>
</html>
